services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: nba
      POSTGRES_PASSWORD: nba
      POSTGRES_DB: nba
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nba -d nba"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      # Paths are relative to this compose file (infra/). The backend lives at
      # the repo root, so context is ../backend and the Dockerfile resolves to
      # ../backend/../infra/Dockerfile.api == infra/Dockerfile.api.
      context: ../backend
      dockerfile: ../infra/Dockerfile.api
    depends_on:
      db:
        condition: service_healthy
    # .env lives at the repo root (next to .env.example); optional so the stack
    # still comes up with deterministic offline defaults when it is absent.
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql://nba:nba@db:5432/nba
    ports:
      - "8000:8000"

  web:
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.web
      args:
        # NEXT_PUBLIC_* values are inlined at build time, so pass it as a build arg.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:
