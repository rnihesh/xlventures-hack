services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: nba
      POSTGRES_PASSWORD: nba
      POSTGRES_DB: nba
    # No host port: the API reaches it over the compose network as db:5432, so it
    # never conflicts with a Postgres already running on the host's 5432.
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nba -d nba"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      # Paths are relative to this compose file (infra/). The backend lives at
      # the repo root, so context is ../backend and the Dockerfile resolves to
      # ../backend/../infra/Dockerfile.api == infra/Dockerfile.api.
      context: ../backend
      dockerfile: ../infra/Dockerfile.api
    depends_on:
      db:
        condition: service_healthy
    # .env lives at the repo root (next to .env.example); optional so the stack
    # still comes up with deterministic offline defaults when it is absent.
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql://nba:nba@db:5432/nba
    ports:
      - "8200:8200"

  web:
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.web
      args:
        # NEXT_PUBLIC_* values are inlined into the client bundle at build time,
        # so they must be build args. They interpolate from the env file passed to
        # `docker compose --env-file <...>` (defaults keep local dev working).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8200}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3200}
        NEXT_PUBLIC_APP_TOKEN: ${NEXT_PUBLIC_APP_TOKEN:-}
    depends_on:
      - api
    ports:
      - "3200:3200"

volumes:
  pgdata:
