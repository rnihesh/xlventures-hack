[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nba-backend"
version = "0.1.0"
description = "Next Best Action backend: FastAPI + LangGraph explainable recommendations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "langgraph>=0.3",
    "langgraph-checkpoint-postgres",
    "langchain-openai",
    "langchain-core",
    "pydantic>=2",
    "pydantic-settings",
    "asyncpg>=0.30",
    "pgvector",
    "alembic>=1.14",
    "sse-starlette",
    "pyyaml",
    "httpx",
    "greenlet>=3.5.2",
    "boto3>=1.34",
    "PyJWT>=2.9",
    "bcrypt>=4.1",
    "email-validator>=2.1",
    "webauthn>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle, I: isort, UP: pyupgrade, B: bugbear
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
