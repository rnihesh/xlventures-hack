name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend (frozen, with dev extras)
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Run tests
        working-directory: backend
        # Blank key keeps tests fully offline (deterministic model, no token spend).
        env:
          OPENAI_API_KEY: ""
        run: uv run pytest

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to droplet
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Only on a push to main (not PRs), after tests + build pass.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    steps:
      - name: Deploy over SSH (pull, rebuild, migrate)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_SSH_PORT || 22 }}
          script: |
            set -e
            cd "${DEPLOY_DIR:-$HOME/xlventures-hack}"
            git fetch --all
            git reset --hard origin/main
            docker compose -f infra/docker-compose.yml up -d --build
            docker compose -f infra/docker-compose.yml exec -T api uv run alembic upgrade head
            docker image prune -f
