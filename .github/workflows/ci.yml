name: CI

on:
  # Only build/deploy when code that ships actually changes. Docs, screenshots,
  # contracts, and README edits do not trigger a build or a deploy.
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/**"
      - ".github/workflows/ci.yml"

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend (frozen, with dev extras)
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Run tests
        working-directory: backend
        # Blank key keeps tests fully offline (deterministic model, no token spend).
        env:
          OPENAI_API_KEY: ""
        run: uv run pytest

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  images:
    name: Build and push images (GHCR)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/Dockerfile.api
          push: true
          tags: |
            ghcr.io/rnihesh/aperture-api:latest
            ghcr.io/rnihesh/aperture-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./infra/Dockerfile.web
          push: true
          # NEXT_PUBLIC_* are baked into the client bundle at build time.
          build-args: |
            NEXT_PUBLIC_API_URL=https://aperture-api.niheshr.com
            NEXT_PUBLIC_SITE_URL=https://aperture.niheshr.com
          tags: |
            ghcr.io/rnihesh/aperture-web:latest
            ghcr.io/rnihesh/aperture-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to droplet (pull + up + migrate)
    runs-on: ubuntu-latest
    needs: [images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Copy prod compose to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_SSH_PORT || 22 }}
          source: "infra/docker-compose.prod.yml"
          target: "aperture/"
          strip_components: 1
      - name: Pull images and restart over SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_SSH_PORT || 22 }}
          envs: GHCR_TOKEN
          script: |
            set -e
            cd "${DEPLOY_DIR:-$HOME/aperture}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans
            docker compose -f docker-compose.prod.yml --env-file .env exec -T api uv run alembic upgrade head
            docker image prune -f
